project:
  name: "AI-Powered Underwater Ship Hull Inspection Drone"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_mavecodd: "data/raw/mavecodd"
  raw_underwater_crack: "data/raw/underwater_crack"
  zip_mavecodd: "ry392rp8cj-1.zip"
  zip_underwater_crack: "under-crack-images.zip"
  processed_dir: "data/processed"
  sample_dir: "data/sample"
  model_dir: "models/checkpoints"
  figures_dir: "outputs/figures"
  metrics_dir: "outputs/metrics"
  reports_dir: "outputs/reports"
  logs_dir: "outputs/inspection_logs"

dataset:
  primary: "mavecodd"
  secondary: "underwater_crack"
  # 60/20/20 instead of 70/15/15: with only ~21 scene groups, 15% would leave
  # a single group per tier in val/test, making the reported metrics unreliable.
  train_split: 0.60
  val_split: 0.20
  test_split: 0.20
  image_size: [256, 256]
  sample_count: 50
  leakage_prevention: true
  # Consecutive frame numbers are near-duplicates (video / burst photos), so they
  # are grouped into blocks of this many frame IDs and never split across partitions.
  scene_block_size: 5
  # Patch-level task shared by BOTH models (fair comparison):
  # image rescaled to this long side, then tiled into patch_size x patch_size tiles.
  patch_long_side: 1024
  patch_size: 256
  patch_defect_min_frac: 0.05   # tile is "defect" if >= 5% of its pixels are corrosion
  patch_sound_max_frac: 0.005   # tile is "sound" if <= 0.5%; tiles in between are ambiguous and skipped

baseline_model:
  # Model A: 47 handcrafted features (Lab colour relative to the whole image, LBP texture,
  # gradient statistics) -> StandardScaler -> RBF-SVM. See extract_handcrafted_features().
  feature_extractor: "relcolor_lbp_grad"
  svm_kernel: "rbf"
  svm_gamma: "scale"
  # Hyperparameters are chosen by scene-grouped cross-validation on the training split
  # (one-standard-error rule -> the simplest model whose CV score is within 1 SE of the best).
  cv_folds: 5
  cv_svm_c: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  cv_pca_components: [null, 8, 16]   # null = no PCA

cnn_model:
  architecture: "unet"
  backbone: "custom_residual"
  in_channels: 3
  out_channels: 1
  image_size: [256, 256]
  base_channels: 16          # ~2M params; smaller net = less capacity to memorise ~45 training images
  work_long_side: 512        # images are resized (aspect kept) so the long side is 512 px
  crop_size: 256             # random training crops taken from the 512 px image
  crops_per_image: 3         # random crops sampled per training image per epoch
  scale_aug: [0.8, 1.6]      # random zoom so the model also handles the closer ROV camera view
  batch_size: 8
  epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0001
  device: "auto"
  early_stopping_patience: 8
  checkpoint_name: "best_unet_model.pth"

simulation:
  hull:
    length_m: 50.0
    height_m: 10.0
    grid_resolution_m: 0.5
    zone_count_x: 5
    zone_count_y: 2
  rov:
    speed_mps: 0.8
    inspection_distance_m: 1.5
    camera_fov_deg: 75.0
    position_noise_std: 0.05
    heading_noise_std: 1.0
  trajectory:
    type: "serpentine"
    step_y_m: 1.0
    step_x_m: 2.0
  environment:
    default_turbidity: 0.2
    red_absorption_factor: 0.65
    contrast_reduction: 0.25
    particle_noise_density: 0.002

storage:
  parquet_dir: "outputs/inspection_logs"
  compression: "snappy"
  batch_size: 100
